[project]
name = "ingest-core"
version = "0.1.0"
description = "Shared market-data acquisition plumbing for Hermes and Hephaestus: provider clients (EODHD, Barchart), in-process rate limiting, retry/backoff, trading-calendar/gap-detection. Orchestration-agnostic and storage-agnostic by design."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests",
    "polars",
    "pandas",
    "pandas-market-calendars",
    "holidays",
]

# Deliberately absent (FR-003): prefect, sqlalchemy, psycopg, pyarrow write paths —
# this library owns no scheduling and no storage.

[project.optional-dependencies]
dev = ["pytest"]
# Optional, not required: the ThetaData client pulls gRPC + zstandard, and only the
# options consumer (Hephaestus) imports it. Hermes installs ingest-core for the EODHD
# price path and has no use for either. clients/thetadata.py imports the package
# lazily and raises a message naming this extra, so a missing install fails legibly
# instead of at import time.
thetadata = ["thetadata"]
# Same pattern for Databento: only the intraday bar producer (Hermes, feeding store_core.BarStore)
# needs it, and clients/databento.py imports it lazily.
databento = ["databento"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["ingest_core*"]
